<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NYC Apartment Recommender</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
      :root{
        --bg1:#9090d8;
        --bg2:#87b5ea;
        --card:#ffffffcc;
        --border:rgba(0,0,0,.08);
        --text:#1f2937;
        --muted:#6b7280;
        --accent:#6d5efc;
        --accent2:#22c1c3;
        --shadow: 0 10px 30px rgba(17, 24, 39, .08);
      }
      *{
        box-sizing:border-box;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
        padding: 2rem 1.25rem;
        max-width: 980px;
        margin: 0 auto;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 15% 15%, var(--bg2), transparent 60%),
          radial-gradient(900px 500px at 85% 0%, #fae4ef, transparent 55%),
          linear-gradient(180deg, var(--bg1), #ffffff);
      }
      h1 { 
        margin: 0 0 1rem;
        letter-spacing: -0.02em;
        font-size: clamp(1.6rem, 2vw + 1rem, 2.2rem);
      }
      .subtitle {
        color: var(--muted);
        margin: -0.4rem 0 1.25rem;
        line-height: 1.4;
      }
      .card {
        background: var(--card);
        padding: 1.4rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        margin-bottom: 1rem;
        backdrop-filter: blur(10px);
      }
      label{
        display:block;
        align-items: center;
        gap: .4rem;
        font-weight:800;
        color: var(--accent);
        background: rgba(109, 94, 252, .10);
        padding: .25rem .6rem;
        border-radius: 999px;
        margin-top: .35rem;
      }
      .input-group {
        display: flex;
        gap: .9rem;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      input[type="range"] {
        flex: 1;
        min-width: 240px;
        accent-color: var(--accent);
      }
      button {
        padding: 0.7rem 1.1rem;
        border-radius: 12px;
        border: 1px solid rgba(109,94,252,.25);
        cursor:pointer;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 10px 24px rgba(109,94,252,.25);
        transition: transform .08s ease, box-shadow .12s ease, filter .12s ease;
      }
      button:hover { 
        filter: brightness(1.02);
        box-shadow: 0 14px 28px rgba(109,94,252,.28);
      }
      button:active {
        transform: translateY(1px) scale(.99);
      }
      .results-count{
        color: var(--muted);
        font-size: .95rem;
        margin: .85rem 0 0; 
      }

      /* Progress bar */
      .progress-bar {
        width: 100%;
        height: 4px;
        background: rgba(109, 94, 252, .12);
        border-radius: 4px;
        margin-top: 1rem;
        overflow: hidden;
        opacity: 0;
        transition: opacity .2s ease;
      }
      .progress-bar.active {
        opacity: 1;
      }
      .progress-bar .bar {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 4px;
        animation: progress-slide 1s ease-in-out infinite;
      }
      @keyframes progress-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }

      /* Error message */
      .error-msg {
        color: #dc2626;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 12px;
        padding: .75rem 1rem;
        margin-top: 1rem;
        display: none;
      }

      /* Map */
      #map {
        width: 100%;
        height: 420px;
        border-radius: 16px;
        box-shadow: var(--shadow);
        margin-bottom: 1rem;
        border: 1px solid var(--border);
        z-index: 0;
      }

      #results{
        display: grid;
        grid-template-columns: 1fr;
        gap: .9rem;
        margin-top: 1rem;
      }
      @media (min-width: 760px){
        #results{
          grid-template-columns: 1fr 1fr;
        }
      }
      .result-item {
        padding: 1rem 1rem;
        background: #f9f9f9;
        border-left: 4px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 22px rgba(17, 24, 39, .06);
        position: relative;
        overflow: hidden;
        transform: translateY(0);
        transition: transform .12s ease, box-shadow .12s ease, opacity .3s ease, border-left-color .2s ease;
        cursor: pointer;
      }
      .result-item::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(450px 200px at 10% 0%, rgba(109,94,252,.14), transparent 60%),
                    radial-gradient(450px 200px at 100% 100%, rgba(34,193,195,.12), transparent 60%);
        pointer-events:none;
      }
      .result-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(17, 24, 39, .1);
      } 
      .result-item strong { 
        display: block;
        font-size: 1.05rem;
        letter-spacing:-0.01em;
        margin-bottom: 0.35rem;
      }
      .details { 
        color: var(--muted);
        line-height: 1.45;
      }
      .pill{
        display:inline-flex;
        gap: .4rem;
        align-items:center;
        font-size:.85rem;
        padding:.25rem .55rem;
        border-radius:999px;
        background: rgba(31,41,55,.06);
        color: rgba(31,41,55,.8);
        margin-right:.4rem;
      }

      /* Fade-in animation for results */
      .result-item.fade-in {
        animation: fadeIn .3s ease forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <h1>NYC Apartment Recommender</h1>
    <p class="subtitle">Pick a budget and I'll suggest neighborhoods in NYC with median rent under it.</p>
    <div class="card">
      <label>Budget Range (per month):<br/>
        <span class="budget-display">$<span id="minBudgetValue">500</span> — $<span id="maxBudgetValue">3000</span></span>
      </label>
      <div class="input-group" style="gap: .4rem;">
        <span style="font-size:.85rem;color:var(--muted);">Min</span>
        <input id="minBudgetSlider" type="range" min="500" max="6000" value="500" step="100"/>
        <span style="font-size:.85rem;color:var(--muted);">Max</span>
        <input id="maxBudgetSlider" type="range" min="500" max="6000" value="3000" step="100"/>
      </div>
      <label style="margin-top: 1rem;">Restaurant Importance:<br/>
        <span id="restaurantLabel"><span id="restaurantValue">0</span>% (Budget-Focused)</span>
      </label>
      <div class="input-group">
        <input id="restaurantSlider" type="range" min="0" max="100" value="0" step="5"/>
      </div>
      <div class="progress-bar" id="progressBar"><div class="bar"></div></div>
      <div class="error-msg" id="errorMsg"></div>
      <p class="results-count" id="resultCount"></p>
    </div>
    <div id="map"></div>
    <div id="results"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
      // Borough colors
      const BOROUGH_COLORS = {
        'manhattan': '#6d5efc',
        'brooklyn': '#22c1c3',
        'queens': '#f59e0b',
        'bronx': '#ef4444',
        'staten-island': '#10b981'
      };

      // NYC bounding box (restrict map to five boroughs)
      const nycBounds = L.latLngBounds(
        [40.4774, -74.2591],  // SW corner
        [40.9176, -73.7004]   // NE corner
      );

      // Initialize map
      const map = L.map('map', {
        center: [40.7128, -73.9500],
        zoom: 11,
        maxBounds: nycBounds.pad(0.1),
        maxBoundsViscosity: 1.0,
        minZoom: 10,
        maxZoom: 16
      });

      L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OSM</a> &copy; <a href="https://carto.com/">CARTO</a>',
        maxZoom: 18
      }).addTo(map);

      // State
      let neighborhoodLayer = null;
      let geojsonData = null;
      let currentRecs = [];
      let highlightedLayer = null;

      // Load GeoJSON
      fetch('/static/nyc-neighborhoods.geojson')
        .then(r => r.json())
        .then(data => {
          geojsonData = data;
          renderNeighborhoods();
          getRecs(); // initial fetch after geo is ready
        })
        .catch(() => {
          // If GeoJSON fails to load, still fetch recommendations
          getRecs();
        });

      function normalizeNameForMatch(name) {
        return name.toLowerCase().replace(/[^a-z0-9]/g, '');
      }

      function isRecommended(featureName) {
        const normalized = normalizeNameForMatch(featureName);
        return currentRecs.findIndex(r => normalizeNameForMatch(r.areaName) === normalized);
      }

      function getStyle(feature) {
        const borough = feature.properties.borough;
        const baseColor = BOROUGH_COLORS[borough] || '#999';
        const recIdx = isRecommended(feature.properties.name);

        if (recIdx >= 0) {
          return {
            fillColor: baseColor,
            fillOpacity: 0.55,
            weight: 2.5,
            color: baseColor,
            opacity: 1
          };
        }
        return {
          fillColor: baseColor,
          fillOpacity: 0.1,
          weight: 0.8,
          color: '#aaa',
          opacity: 0.5
        };
      }

      function highlightFeature(e) {
        const layer = e.target;
        layer.setStyle({
          fillOpacity: 0.6,
          weight: 3,
          color: '#333',
          opacity: 1
        });
        layer.bringToFront();
        highlightedLayer = layer;
      }

      function resetHighlight(e) {
        if (neighborhoodLayer) {
          neighborhoodLayer.resetStyle(e.target);
        }
        highlightedLayer = null;
      }

      function onFeatureClick(e) {
        const name = e.target.feature.properties.name;
        const recIdx = isRecommended(name);
        if (recIdx >= 0) {
          map.fitBounds(e.target.getBounds(), { padding: [40, 40] });
        }
      }

      function renderNeighborhoods() {
        if (!geojsonData) return;

        if (neighborhoodLayer) {
          map.removeLayer(neighborhoodLayer);
        }

        neighborhoodLayer = L.geoJSON(geojsonData, {
          style: getStyle,
          onEachFeature: (feature, layer) => {
            const name = feature.properties.name;
            const borough = feature.properties.borough;
            const boroughLabel = borough.charAt(0).toUpperCase() + borough.slice(1).replace('-', ' ');
            const recIdx = isRecommended(name);

            let tooltipContent = `<strong>${name}</strong><br>${boroughLabel}`;
            if (recIdx >= 0) {
              const rec = currentRecs[recIdx];
              tooltipContent += `<br>$${Math.round(rec.rent).toLocaleString()}/mo`;
              tooltipContent += `<br>🍽️ ${Math.round(rec.restaurant_count) || 0} A-grade`;
              tooltipContent += `<br><em>#${recIdx + 1} recommendation</em>`;
            }

            layer.bindTooltip(tooltipContent, {
              sticky: true,
              className: 'neighborhood-tooltip'
            });

            layer.on({
              mouseover: highlightFeature,
              mouseout: resetHighlight,
              click: onFeatureClick
            });
          }
        }).addTo(map);
      }

      // UI elements
      const minBudgetSlider = document.getElementById('minBudgetSlider');
      const maxBudgetSlider = document.getElementById('maxBudgetSlider');
      const minBudgetValue = document.getElementById('minBudgetValue');
      const maxBudgetValue = document.getElementById('maxBudgetValue');
      const restaurantSlider = document.getElementById('restaurantSlider');
      const restaurantLabel = document.getElementById('restaurantLabel');
      const resultCount = document.getElementById('resultCount');
      const progressBar = document.getElementById('progressBar');
      const errorMsg = document.getElementById('errorMsg');

      let debounceTimer = null;

      function updateBudgetLabels() {
        let minVal = Number(minBudgetSlider.value);
        let maxVal = Number(maxBudgetSlider.value);
        // Ensure min doesn't exceed max
        if (minVal > maxVal) {
          minBudgetSlider.value = maxVal;
          minVal = maxVal;
        }
        minBudgetValue.textContent = minVal;
        maxBudgetValue.textContent = maxVal;
      }

      function updateRestaurantLabel() {
        const val = Number(restaurantSlider.value);
        const label = val === 0 ? "Budget-Focused" : val === 100 ? "Restaurant-Focused" : "Mixed";
        restaurantLabel.innerHTML = `<span id="restaurantValue">${val}</span>% (${label})`;
      }

      function debouncedFetch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(getRecs, 300);
      }

      minBudgetSlider.addEventListener('input', () => {
        updateBudgetLabels();
        debouncedFetch();
      });

      maxBudgetSlider.addEventListener('input', () => {
        updateBudgetLabels();
        debouncedFetch();
      });

      restaurantSlider.addEventListener('input', () => {
        updateRestaurantLabel();
        debouncedFetch();
      });

      async function getRecs() {
        const minRent = Number(minBudgetSlider.value);
        const maxRent = Number(maxBudgetSlider.value);
        const restaurantImportance = Number(restaurantSlider.value);

        progressBar.classList.add('active');
        errorMsg.style.display = 'none';

        try {
          const params = new URLSearchParams({
            min_rent: minRent,
            max_rent: maxRent,
            top_n: 10,
            restaurant_importance: restaurantImportance
          });

          const res = await fetch('/api/recommend?' + params.toString());
          if (!res.ok) throw new Error(`Server error (${res.status})`);

          const data = await res.json();
          const recs = data.recommendations || [];
          currentRecs = recs;

          // Re-render map with new recommendations highlighted
          renderNeighborhoods();

          // Update result count
          const out = document.getElementById('results');
          out.innerHTML = '';
          resultCount.textContent = recs.length > 0
            ? `Found ${recs.length} neighborhood${recs.length !== 1 ? 's' : ''} within budget`
            : 'No neighborhoods found within budget';

          if (recs.length === 0) {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = '<p style="color: #999;">Try increasing your budget or adjusting filters.</p>';
            out.appendChild(el);
            return;
          }

          recs.forEach((r, idx) => {
            const el = document.createElement('div');
            el.className = 'result-item fade-in';
            el.style.animationDelay = `${idx * 0.05}s`;

            // Color the left border by borough
            const boroughKey = r.Borough.toLowerCase().replace(' ', '-');
            const borderColor = BOROUGH_COLORS[boroughKey] || '#ccc';
            el.style.borderLeftColor = borderColor;

            el.innerHTML = `
              <strong>#${idx + 1} — ${r.areaName}</strong>
              <div class="details">
                <span class="pill" style="background:${borderColor}20; color:${borderColor}">${r.Borough}</span>
                <span class="pill">${r.areaType}</span>
                <span class="pill">$${Math.round(r.rent).toLocaleString()}/mo</span>
                <span class="pill">🍽️ ${Math.round(r.restaurant_count) || 0} A-grade</span>
              </div>
            `;

            // Click result to zoom to neighborhood on map
            el.addEventListener('click', () => {
              if (!neighborhoodLayer) return;
              const normalized = normalizeNameForMatch(r.areaName);
              neighborhoodLayer.eachLayer(layer => {
                if (normalizeNameForMatch(layer.feature.properties.name) === normalized) {
                  map.fitBounds(layer.getBounds(), { padding: [40, 40], maxZoom: 14 });
                  layer.openTooltip();
                }
              });
            });

            out.appendChild(el);
          });
        } catch (err) {
          errorMsg.textContent = `Failed to load recommendations: ${err.message}`;
          errorMsg.style.display = 'block';
        } finally {
          progressBar.classList.remove('active');
        }
      }
    </script>
  </body>
</html>
