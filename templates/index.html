<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NYC Apartment Recommender</title>
    <style>
      :root{
        --bg1:#9090d8;
        --bg2:#87b5ea;
        --card:#ffffffcc;
        --border:rgba(0,0,0,.08);
        --text:#1f2937;
        --muted:#6b7280;
        --accent:#6d5efc;
        --accent2:#22c1c3;
        --shadow: 0 10px 30px rgba(17, 24, 39, .08);
      }
      *{
        box-sizing:border-box;
      }
      body {
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Arial;
        padding: 2rem 1.25rem;
        max-width: 980px;
        margin: 0 auto;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 15% 15%, var(--bg2), transparent 60%),
          radial-gradient(900px 500px at 85% 0%, #fae4ef, transparent 55%),
          linear-gradient(180deg, var(--bg1), #ffffff);
      }
      h1 { 
        margin: 0 0 1rem;
        letter-spacing: -0.02em;
        font-size: clamp(1.6rem, 2vw + 1rem, 2.2rem);
      }
      .subtitle {
        color: var(--muted);
        margin: -0.4rem 0 1.25rem;
        line-height: 1.4;
      }
      .card {
        background: var(--card);
        padding: 1.4rem;
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--shadow);
        margin-bottom: 1rem;
        backdrop-filter: blur(10px);
      }
      label{
        display:block;
        align-items: center;
        gap: .4rem;
        font-weight:800;
        color: var(--accent);
        background: rgba(109, 94, 252, .10);
        padding: .25rem .6rem;
        border-radius: 999px;
        margin-top: .35rem;
      }
      .input-group {
        display: flex;
        gap: .9rem;
        align-items: center;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }
      input[type="range"] {
        flex: 1;
        min-width: 240px;
        accent-color: var(--accent);
      }
      button {
        padding: 0.7rem 1.1rem;
        border-radius: 12px;
        border: 1px solid rgba(109,94,252,.25);
        cursor:pointer;
        font-size: 1rem;
        font-weight: 600;
        color: white;
        background: linear-gradient(135deg, var(--accent), var(--accent2));
        box-shadow: 0 10px 24px rgba(109,94,252,.25);
        transition: transform .08s ease, box-shadow .12s ease, filter .12s ease;
      }
      button:hover { 
        filter: brightness(1.02);
        box-shadow: 0 14px 28px rgba(109,94,252,.28);
      }
      button:active {
        transform: translateY(1px) scale(.99);
      }
      .results-count{
        color: var(--muted);
        font-size: .95rem;
        margin: .85rem 0 0; 
      }

      /* Progress bar */
      .progress-bar {
        width: 100%;
        height: 4px;
        background: rgba(109, 94, 252, .12);
        border-radius: 4px;
        margin-top: 1rem;
        overflow: hidden;
        opacity: 0;
        transition: opacity .2s ease;
      }
      .progress-bar.active {
        opacity: 1;
      }
      .progress-bar .bar {
        height: 100%;
        width: 30%;
        background: linear-gradient(90deg, var(--accent), var(--accent2));
        border-radius: 4px;
        animation: progress-slide 1s ease-in-out infinite;
      }
      @keyframes progress-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(400%); }
      }

      /* Error message */
      .error-msg {
        color: #dc2626;
        background: #fef2f2;
        border: 1px solid #fecaca;
        border-radius: 12px;
        padding: .75rem 1rem;
        margin-top: 1rem;
        display: none;
      }

      #results{
        display: grid;
        grid-template-columns: 1fr;
        gap: .9rem;
        margin-top: 1rem;
      }
      @media (min-width: 760px){
        #results{
          grid-template-columns: 1fr 1fr;
        }
      }
      .result-item {
        padding: 1rem 1rem;
        background: #f9f9f9;
        border-left: 4px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 10px 22px rgba(17, 24, 39, .06);
        position: relative;
        overflow: hidden;
        transform: translateY(0);
        transition: transform .12s ease, box-shadow .12s ease, opacity .3s ease;
      }
      .result-item::before {
        content: "";
        position: absolute;
        inset: 0;
        background: radial-gradient(450px 200px at 10% 0%, rgba(109,94,252,.14), transparent 60%),
                    radial-gradient(450px 200px at 100% 100%, rgba(34,193,195,.12), transparent 60%);
        pointer-events:none;
      }
      .result-item:hover {
        transform: translateY(-2px);
        box-shadow: 0 14px 30px rgba(17, 24, 39, .1);
      } 
      .result-item strong { 
        display: block;
        font-size: 1.05rem;
        letter-spacing:-0.01em;
        margin-bottom: 0.35rem;
      }
      .details { 
        color: var(--muted);
        line-height: 1.45;
      }
      .pill{
        display:inline-flex;
        gap: .4rem;
        align-items:center;
        font-size:.85rem;
        padding:.25rem .55rem;
        border-radius:999px;
        background: rgba(31,41,55,.06);
        color: rgba(31,41,55,.8);
        margin-right:.4rem;
      }

      /* Fade-in animation for results */
      .result-item.fade-in {
        animation: fadeIn .3s ease forwards;
      }
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <h1>NYC Apartment Recommender</h1>
    <p class="subtitle">Pick a budget and I'll suggest neighborhoods in NYC with median rent under it.</p>
    <div class="card">
      <label>Max Budget (per month):<br/>
        <span class="budget-display">$<span id="budgetValue">3000</span></span>
      </label>
      <div class="input-group">
        <input id="budgetSlider" type="range" min="500" max="6000" value="3000" step="100"/>
      </div>
      <label style="margin-top: 1rem;">Restaurant Importance:<br/>
        <span id="restaurantLabel"><span id="restaurantValue">0</span>% (Budget-Focused)</span>
      </label>
      <div class="input-group">
        <input id="restaurantSlider" type="range" min="0" max="100" value="0" step="5"/>
      </div>
      <div class="progress-bar" id="progressBar"><div class="bar"></div></div>
      <div class="error-msg" id="errorMsg"></div>
      <p class="results-count" id="resultCount"></p>
    </div>
    <div id="results"></div>

    <script>
      const budgetSlider = document.getElementById('budgetSlider');
      const budgetValue = document.getElementById('budgetValue');
      const restaurantSlider = document.getElementById('restaurantSlider');
      const restaurantValue = document.getElementById('restaurantValue');
      const restaurantLabel = document.getElementById('restaurantLabel');
      const resultCount = document.getElementById('resultCount');
      const progressBar = document.getElementById('progressBar');
      const errorMsg = document.getElementById('errorMsg');

      let debounceTimer = null;

      function updateBudgetLabel() {
        budgetValue.textContent = budgetSlider.value;
      }

      function updateRestaurantLabel() {
        const val = Number(restaurantSlider.value);
        const label = val === 0 ? "Budget-Focused" : val === 100 ? "Restaurant-Focused" : "Mixed";
        restaurantLabel.innerHTML = `<span id="restaurantValue">${val}</span>% (${label})`;
      }

      function debouncedFetch() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(getRecs, 300);
      }

      budgetSlider.addEventListener('input', () => {
        updateBudgetLabel();
        debouncedFetch();
      });

      restaurantSlider.addEventListener('input', () => {
        updateRestaurantLabel();
        debouncedFetch();
      });

      async function getRecs() {
        const maxRent = Number(budgetSlider.value);
        const restaurantImportance = Number(restaurantSlider.value);

        // Show progress bar
        progressBar.classList.add('active');
        errorMsg.style.display = 'none';

        try {
          const params = new URLSearchParams({
            max_rent: maxRent,
            top_n: 10,
            restaurant_importance: restaurantImportance
          });

          const res = await fetch('/api/recommend?' + params.toString());

          if (!res.ok) {
            throw new Error(`Server error (${res.status})`);
          }

          const data = await res.json();
          const out = document.getElementById('results');
          out.innerHTML = '';

          const recs = data.recommendations || [];
          resultCount.textContent = recs.length > 0
            ? `Found ${recs.length} neighborhood${recs.length !== 1 ? 's' : ''} within budget`
            : 'No neighborhoods found within budget';

          if (recs.length === 0) {
            const el = document.createElement('div');
            el.className = 'card';
            el.innerHTML = '<p style="color: #999;">Try increasing your budget or adjusting filters.</p>';
            out.appendChild(el);
            return;
          }

          recs.forEach((r, idx) => {
            const el = document.createElement('div');
            el.className = 'result-item fade-in';
            el.style.animationDelay = `${idx * 0.05}s`;
            el.innerHTML = `
              <strong>#${idx + 1} — ${r.areaName}</strong>
              <div class="details">
                <span class="pill">${r.Borough}</span>
                <span class="pill">${r.areaType}</span>
                <span class="pill">$${Math.round(r.rent).toLocaleString()}/mo</span>
                <span class="pill">🍽️ ${Math.round(r.restaurant_count) || 0} A-grade</span>
              </div>
            `;
            out.appendChild(el);
          });
        } catch (err) {
          errorMsg.textContent = `Failed to load recommendations: ${err.message}`;
          errorMsg.style.display = 'block';
        } finally {
          progressBar.classList.remove('active');
        }
      }

      // Fetch on page load
      getRecs();
    </script>
  </body>
</html>
